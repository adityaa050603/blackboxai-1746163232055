<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stations - GreenGrid</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 500px; }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
</head>
<body class="bg-gray-50 font-['Roboto'] min-h-screen flex flex-col">
  <header class="bg-green-700 text-white shadow">
    <div class="container mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold">GreenGrid</h1>
      <nav class="space-x-6">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="stations.html" class="hover:underline font-semibold">Stations</a>
        <a href="user-login.html" class="hover:underline">User Login</a>
        <a href="admin-login.html" class="hover:underline">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 flex flex-col md:flex-row gap-6 flex-grow">
    <section class="md:w-1/3 bg-white rounded-lg shadow p-4">
      <h2 class="text-xl font-bold mb-4">Filter Stations</h2>
      <form id="filterForm" class="space-y-4">
        <div>
          <label class="inline-flex items-center">
            <input type="checkbox" name="type" value="EV" checked class="form-checkbox text-green-600" />
            <span class="ml-2">EV Charging Stations</span>
          </label>
        </div>
        <div>
          <label class="inline-flex items-center">
            <input type="checkbox" name="type" value="CNG" checked class="form-checkbox text-green-600" />
            <span class="ml-2">CNG Refueling Stations</span>
          </label>
        </div>
      </form>
      <h2 class="text-xl font-bold mt-8 mb-4">Station List</h2>
      <ul id="stationList" class="space-y-2 max-h-[400px] overflow-y-auto"></ul>
    </section>

    <section class="md:w-2/3 rounded-lg shadow overflow-hidden">
      <div id="map"></div>
    </section>
  </main>

  <footer class="bg-green-700 text-white text-center p-4">
    &copy; 2024 GreenGrid. All rights reserved.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
